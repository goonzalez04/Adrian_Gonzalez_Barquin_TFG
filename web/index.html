<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Planificador de rotación de cultivos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
	    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
	    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

</head>
<body>
    <h1>Planificador de rotación de cultivos</h1>
    <div id="mapa" style="height: 600px;"></div>
    <script>
        const mapa = L.map('mapa').setView([42.367778, -4.026667], 15);

        const capaOSM = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });
        capaOSM.addTo(mapa);

        const capaSatelite = L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma', {
            layers: 'OI.OrthoimageCoverage',
            format: 'image/jpeg',
            version: '1.3.0',
            maxZoom: 20,
            attribution: 'PNOA © Instituto Geográfico Nacional'
        });


        const capaSigpac = L.tileLayer.wms('https://sigpac-hubcloud.es/wms', {
            layers: 'recinto', 
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'SIGPAC © FEGA'
        });
        capaSigpac.addTo(mapa);

        L.control.layers(
            {"Mapa": capaOSM, "Satelite": capaSatelite},
            {"Recintos SIGPAC": capaSigpac}
        ).addTo(mapa);
    </script>
</body>
</html>
